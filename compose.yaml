services:

  frontend:
    build:
      context: ./ScrBoard/scrboard.client
      dockerfile: Dockerfile
      args:
        VITE_BASE: /

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      - backend


  backend:
    build:
      context: ./ScrBoard/ScrBoard.Server
      dockerfile: Dockerfile

    expose:
      - "8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

    volumes:
      - ./ScrBoard/ScrBoard.Server/Data:/app/Data
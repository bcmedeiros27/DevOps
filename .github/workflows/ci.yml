name: ScrBoard CI

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ScrBoard/scrboard.client/package-lock.json

      - name: Restore Backend Packages
        run: dotnet restore ScrBoard/ScrBoard.sln

      - name: Build Backend
        run: dotnet build ScrBoard/ScrBoard.sln --configuration Release --no-restore

      - name: Install Frontend Packages
        working-directory: ScrBoard/scrboard.client
        run: npm ci

      - name: Build Frontend
        working-directory: ScrBoard/scrboard.client
        run: npm run build


  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ScrBoard/scrboard.client/package-lock.json

      - name: Restore Backend Packages
        run: dotnet restore ScrBoard/ScrBoard.sln

      - name: Run Backend xUnit Tests
        run: dotnet test ScrBoard/ScrBoard.Server.Tests/ScrBoard.Server.Tests.csproj --configuration Release

      - name: Install Frontend Packages
        working-directory: ScrBoard/scrboard.client
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: ScrBoard/scrboard.client
        run: npm test -- --run